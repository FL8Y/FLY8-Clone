name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Legacy footprint check
        shell: bash
        run: |
          if grep -RniE "io\.eysclone|EysClone|EysClone by|io\.virtualapp\.license|ActivationActivity" . --exclude-dir=.git; then
            echo "Legacy branding or activation code detected."
            exit 1
          fi

      - name: Build release
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLY8-Clone-beta
          path: app/build/outputs/apk/release/app-release.apk
