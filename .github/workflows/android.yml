name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject legacy prototype material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'EysClone|io\.eysclone\.app|VirtualApp|XposedInstaller|SPAKE2|LibADB' -- ':!THIRD_PARTY_NOTICES.md' ':!.github/workflows/android.yml'; then
            echo "Legacy prototype material found in tracked project files."
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build release
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          echo "APK size: $(du -h "$apk" | cut -f1)"
          "$AAPT2" dump badging "$apk" | grep -F "package: name='com.fly8.clone'"
          "$AAPT2" dump badging "$apk" | grep -F "application-label:'FLY8 Clone'"
          if unzip -l "$apk" | grep -E 'EysClone|XposedInstaller|VirtualApp|SPAKE2|LibADB'; then
            echo "Forbidden legacy payload found inside APK."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: FLY8-Clone-beta
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
